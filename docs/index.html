<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Quản trị chấm công POS</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @media print { body * { visibility:hidden } #slip-preview, #slip-preview * { visibility:visible }
    #slip-preview { position:absolute; left:0; top:0; width:100%; height:auto } body { height:auto !important } }
</style>
</head>
<body class="min-h-screen bg-slate-100">
<div id="app"></div>
<script>
// ==================== STATE ====================
// stores: danh sách quán [{name, url}] trong localStorage — url là tunnel URL
// hoặc IP LAN của máy POS, vd https://pos-quan1.trycloudflare.com
// sess: phiên đăng nhập vào 1 server POS {url, name, token} — sessionStorage
const $ = (id) => document.getElementById(id);
const stores = () => JSON.parse(localStorage.getItem("hubadmin_stores") || "[]");
const saveStores = (s) => localStorage.setItem("hubadmin_stores", JSON.stringify(s));
const S = () => JSON.parse(sessionStorage.getItem("hubadmin_sess") || "null");
const setSess = (s) => s ? sessionStorage.setItem("hubadmin_sess", JSON.stringify(s))
                         : sessionStorage.removeItem("hubadmin_sess");

let users = [];       // tài khoản server POS đang quản trị
let shifts = [];      // ca làm trong khoảng đang xem
let payrolls = [];    // phiếu lương
let tab = "shifts";   // shifts | staff | month | payroll
let shiftsLoaded = false;

function fmtMoney(n) { return (Number(n) || 0).toLocaleString("vi-VN") + "đ"; }
function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso); if (isNaN(d)) return "—";
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso); if (isNaN(d)) return "—";
  return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0");
}
function fmtDT(iso) { return iso ? fmtDate(iso) + " " + fmtTime(iso) : "—"; }
function hoursOf(r) { // giờ làm của 1 ca
  if (!r.check_in_at) return 0;
  const out = r.check_out_at ? new Date(r.check_out_at) : new Date();
  return Math.max(0, (out - new Date(r.check_in_at)) / 3600000);
}
function isoToLocalInput(iso) { // ISO -> "YYYY-MM-DDTHH:mm" (giờ local)
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const p = (x) => String(x).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function today() { return new Date().toISOString().slice(0,10); }
function monthNow() { return new Date().toISOString().slice(0,7); }
function normUrl(u) { return String(u || "").trim().replace(/\/+$/, ""); }

async function api(path, opts = {}) { // gọi thẳng tới server POS
  const s = S(); if (!s) throw new Error("Chưa đăng nhập");
  const res = await fetch(s.url + path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${s.token}`,
      ...(opts.headers || {}),
    },
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { setSess(null); render(); throw new Error("Hết phiên — đăng nhập lại"); }
  if (!res.ok) throw new Error(data.message || data.error || `HTTP ${res.status}`);
  return data;
}

function toast(msg, ok = true) {
  const t = document.createElement("div");
  t.className = `fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl text-sm text-white shadow-lg z-50 ${ok ? "bg-emerald-600" : "bg-red-600"}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

// ==================== SCREENS ====================
function render() {
  const s = S();
  $("app").innerHTML = s ? mainHtml(s) : loginHtml();
  bindCommon();
  if (s) { bindMain(); loadUsers(); }
  else bindLogin();
}

// ---------- Màn 1+2: chọn quán + đăng nhập ----------
function loginHtml() {
  const st = stores();
  return `
  <div class="max-w-md mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">Quản trị chấm công</h1>
    <p class="text-sm text-slate-500 mb-6">Kết nối trực tiếp tới server POS của quán — mọi chỉnh sửa ghi vào dữ liệu thật tại quán.</p>

    <div class="bg-white rounded-2xl shadow p-5 mb-4">
      <h2 class="font-semibold text-slate-700 mb-3">Đăng nhập vào quán</h2>
      <label class="text-xs text-slate-500">Chọn quán</label>
      <select id="login-store" class="w-full border rounded-xl px-3 py-2 mb-3">
        ${st.length ? st.map((x,i)=>`<option value="${i}">${esc(x.name)} — ${esc(x.url)}</option>`).join("")
                     : `<option value="">(chưa có quán — thêm ở dưới)</option>`}
      </select>
      <label class="text-xs text-slate-500">Tài khoản admin</label>
      <input id="login-user" class="w-full border rounded-xl px-3 py-2 mb-2" placeholder="username (vd: admin)"/>
      <label class="text-xs text-slate-500">Mật khẩu</label>
      <input id="login-pass" type="password" class="w-full border rounded-xl px-3 py-2 mb-3" placeholder="••••••"/>
      <button id="btn-login" class="w-full bg-slate-800 text-white rounded-xl py-2 font-semibold">Đăng nhập</button>
      <p id="login-err" class="text-red-600 text-sm mt-2"></p>
      <p class="text-xs text-slate-400 mt-3">Lưu ý: trang HTTPS chỉ gọi được server quán qua URL HTTPS — dùng Cloudflare Tunnel URL (Bật tunnel trong Cấu hình POS). Nếu dùng IP LAN (http://192.168…) hãy mở trang này trên thiết bị cùng mạng và chấp nhận mixed-content, hoặc mở app POS → /quanly-chamcong.</p>
    </div>

    <div class="bg-white rounded-2xl shadow p-5">
      <h2 class="font-semibold text-slate-700 mb-3">Quán đã lưu</h2>
      <div id="store-list">${st.map((x,i)=>`
        <div class="flex items-center gap-2 py-2 border-b last:border-0">
          <div class="flex-1 min-w-0">
            <div class="font-medium text-slate-800 truncate">${esc(x.name)}</div>
            <div class="text-xs text-slate-400 truncate">${esc(x.url)}</div>
          </div>
          <button class="text-red-500 text-sm" data-del-store="${i}">Xoá</button>
        </div>`).join("") || `<p class="text-sm text-slate-400">Chưa có quán nào.</p>`}
      </div>
      <div class="flex gap-2 mt-3">
        <input id="ns-name" class="flex-1 border rounded-xl px-3 py-2 text-sm" placeholder="Tên quán (vd: Quán 1)"/>
        <input id="ns-url" class="flex-[2] border rounded-xl px-3 py-2 text-sm" placeholder="https://xxx.trycloudflare.com"/>
        <button id="btn-add-store" class="bg-emerald-600 text-white rounded-xl px-4 text-sm font-semibold">Thêm</button>
      </div>
    </div>
  </div>`;
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function bindLogin() {
  $("btn-add-store")?.addEventListener("click", () => {
    const name = $("ns-name").value.trim(), url = normUrl($("ns-url").value);
    if (!name || !url) return toast("Nhập tên + URL server", false);
    const st = stores();
    if (st.some(x => x.url === url)) return toast("URL đã tồn tại", false);
    st.push({ name, url }); saveStores(st); render();
  });
  document.querySelectorAll("[data-del-store]").forEach(b =>
    b.addEventListener("click", () => { const st = stores(); st.splice(+b.dataset.delStore, 1); saveStores(st); render(); }));
  $("btn-login")?.addEventListener("click", doLogin);
  $("login-pass")?.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
}

async function doLogin() {
  const idx = $("login-store").value;
  const st = stores();
  if (idx === "" || !st[+idx]) return $("login-err").textContent = "Chọn quán trước";
  const store = st[+idx];
  $("login-err").textContent = "Đang kết nối…";
  try {
    const res = await fetch(store.url + "/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("login-user").value.trim(), password: $("login-pass").value }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);
    if (data.user?.role !== "admin") throw new Error("Chỉ tài khoản admin mới quản lý chấm công");
    setSess({ url: store.url, name: store.name, token: data.access_token, user: data.user });
    toast("Đã đăng nhập " + store.name);
    render();
  } catch (e) {
    $("login-err").textContent = e.message || "Không kết nối được server";
  }
}

// ---------- Màn 3: quản trị ----------
function mainHtml(s) {
  const tabs = [["shifts","Ca làm"],["staff","Nhân viên"],["month","Bảng công"],["payroll","Phiếu lương"]];
  return `
  <div class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-5 flex-wrap gap-2">
      <div>
        <h1 class="text-xl font-bold text-slate-800">${esc(s.name)} — Quản trị chấm công</h1>
        <div class="text-xs text-slate-400">${esc(s.url)}</div>
      </div>
      <button id="btn-logout" class="text-sm text-slate-500 underline">Đăng xuất</button>
    </div>
    <div class="flex gap-2 mb-5 flex-wrap">
      ${tabs.map(([k,l])=>`<button data-tab="${k}" class="px-4 py-2 rounded-xl text-sm font-semibold ${tab===k?"bg-slate-800 text-white":"bg-white text-slate-600 shadow"}">${l}</button>`).join("")}
    </div>
    <div id="tab-content"></div>
  </div>
  <div id="modal-root"></div>`;
}
function bindCommon() {}
function bindMain() {
  document.querySelectorAll("[data-tab]").forEach(b =>
    b.addEventListener("click", () => { tab = b.dataset.tab; render(); }));
  $("btn-logout").addEventListener("click", () => { setSess(null); render(); });
}

async function loadUsers() {
  try {
    users = await api("/api/admin/employees");
    renderTab();
  } catch (e) { toast(e.message, false); }
}
async function loadShifts() {
  const from = $("f-from")?.value || today();
  const to = $("f-to")?.value || today();
  shifts = await api(`/api/admin/attendance?from=${from}&to=${to}`);
  renderTab();
}
function renderTab() {
  const c = $("tab-content"); if (!c) return;
  if (tab === "shifts") {
    c.innerHTML = shiftsHtml(); bindShifts();
    if (!shiftsLoaded) { shiftsLoaded = true; loadShifts().catch(e => toast(e.message, false)); }
  }
  else if (tab === "staff") c.innerHTML = staffHtml(), bindStaff();
  else if (tab === "month") c.innerHTML = monthHtml(), bindMonth();
  else c.innerHTML = payrollHtml(), bindPayroll();
}

// ---------- Tab Ca làm ----------
function shiftsHtml() {
  return `
  <div class="bg-white rounded-2xl shadow p-5">
    <div class="flex gap-2 items-end flex-wrap mb-4">
      <div><label class="text-xs text-slate-500">Từ ngày</label>
        <input id="f-from" type="date" value="${today()}" class="border rounded-xl px-3 py-2"/></div>
      <div><label class="text-xs text-slate-500">Đến ngày</label>
        <input id="f-to" type="date" value="${today()}" class="border rounded-xl px-3 py-2"/></div>
      <button id="btn-load-shifts" class="bg-slate-800 text-white rounded-xl px-4 py-2 text-sm font-semibold">Xem</button>
      <button id="btn-add-shift" class="bg-emerald-600 text-white rounded-xl px-4 py-2 text-sm font-semibold">+ Thêm ca (quên chấm)</button>
    </div>
    <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead><tr class="text-left text-slate-400 border-b">
        <th class="py-2">Nhân viên</th><th>Ngày</th><th>Vào</th><th>Ra</th><th>Giờ</th><th></th></tr></thead>
      <tbody>${shifts.map(r => `
        <tr class="border-b last:border-0">
          <td class="py-2 font-medium">${esc(r.name || "?")}</td>
          <td>${fmtDate(r.check_in_at)}</td>
          <td>${fmtTime(r.check_in_at)}</td>
          <td>${r.check_out_at ? fmtTime(r.check_out_at) : '<span class="text-amber-600">đang làm</span>'}</td>
          <td>${hoursOf(r).toFixed(1)}h</td>
          <td class="text-right whitespace-nowrap">
            ${!r.check_out_at ? `<button class="text-amber-600 text-xs mr-2" data-close="${r.id}">Tan ca</button>` : ""}
            <button class="text-blue-600 text-xs mr-2" data-edit="${r.id}">Sửa</button>
            <button class="text-red-500 text-xs" data-del="${r.id}">Xoá</button>
          </td>
        </tr>`).join("") || `<tr><td colspan="6" class="py-6 text-center text-slate-400">Chưa có dữ liệu — chọn ngày rồi bấm Xem</td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}
function bindShifts() {
  $("btn-load-shifts").addEventListener("click", () => loadShifts().catch(e => toast(e.message, false)));
  $("btn-add-shift").addEventListener("click", () => openShiftModal(null));
  document.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openShiftModal(shifts.find(r => r.id == b.dataset.edit))));
  document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("Xoá ca này?")) return;
    try { await api(`/api/admin/attendance/${b.dataset.del}`, { method: "DELETE" }); toast("Đã xoá"); loadShifts(); }
    catch (e) { toast(e.message, false); }
  }));
  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", async () => {
    try { await api(`/api/admin/attendance/${b.dataset.close}`, { method: "PUT", body: JSON.stringify({ check_out_at: new Date().toISOString() }) }); toast("Đã tan ca"); loadShifts(); }
    catch (e) { toast(e.message, false); }
  }));
}
function openShiftModal(r) {
  const staffUsers = users.filter(u => u.active !== 0);
  $("modal-root").innerHTML = `
  <div class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-40">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm">
      <h3 class="font-bold text-slate-800 mb-4">${r ? "Sửa ca" : "Thêm ca thủ công"}</h3>
      ${r ? "" : `<label class="text-xs text-slate-500">Nhân viên</label>
        <select id="m-user" class="w-full border rounded-xl px-3 py-2 mb-3">
          ${staffUsers.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}
        </select>`}
      <label class="text-xs text-slate-500">Giờ vào</label>
      <input id="m-in" type="datetime-local" value="${r ? isoToLocalInput(r.check_in_at) : ""}" class="w-full border rounded-xl px-3 py-2 mb-3"/>
      <label class="text-xs text-slate-500">Giờ ra (để trống = đang làm)</label>
      <input id="m-out" type="datetime-local" value="${r ? isoToLocalInput(r.check_out_at) : ""}" class="w-full border rounded-xl px-3 py-2 mb-4"/>
      <div class="flex gap-2">
        <button id="m-cancel" class="flex-1 border rounded-xl py-2 text-sm">Huỷ</button>
        <button id="m-save" class="flex-1 bg-slate-800 text-white rounded-xl py-2 text-sm font-semibold">Lưu</button>
      </div>
    </div>
  </div>`;
  $("m-cancel").addEventListener("click", () => $("modal-root").innerHTML = "");
  $("m-save").addEventListener("click", async () => {
    const ci = $("m-in").value, co = $("m-out").value;
    if (!ci) return toast("Nhập giờ vào", false);
    const body = {
      check_in_at: new Date(ci).toISOString(),
      check_out_at: co ? new Date(co).toISOString() : null,
      note: "nhập tay",
    };
    try {
      if (r) await api(`/api/admin/attendance/${r.id}`, { method: "PUT", body: JSON.stringify(body) });
      else await api("/api/admin/attendance", { method: "POST", body: JSON.stringify({ ...body, user_id: +$("m-user").value }) });
      $("modal-root").innerHTML = ""; toast("Đã lưu"); loadShifts();
    } catch (e) { toast(e.message, false); }
  });
}

// ---------- Tab Nhân viên (employees — chỉ tên + lương/giờ) ----------
function staffHtml() {
  return `
  <div class="bg-white rounded-2xl shadow p-5">
    <div class="flex justify-between items-center mb-4">
      <div>
        <h2 class="font-semibold text-slate-700">Nhân viên chấm công</h2>
        <p class="text-xs text-slate-400 mt-1">Chỉ cần tên — thẻ hiện trên màn chấm công tại quán, không phải tài khoản đăng nhập.</p>
      </div>
      <button id="btn-add-user" class="bg-emerald-600 text-white rounded-xl px-4 py-2 text-sm font-semibold whitespace-nowrap">+ Thêm</button>
    </div>
    <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead><tr class="text-left text-slate-400 border-b">
        <th class="py-2">Mã</th><th>Tên</th><th class="text-right">Lương/giờ</th><th>Trạng thái</th><th></th></tr></thead>
      <tbody>${users.map(u => `
        <tr class="border-b last:border-0 ${u.active ? "" : "opacity-40"}">
          <td class="py-2 text-xs text-slate-400 font-mono">#${u.id}</td>
          <td class="py-2 font-medium">${esc(u.name)}</td>
          <td class="text-right font-semibold">${u.hourly_rate ? fmtMoney(u.hourly_rate) : "—"}</td>
          <td><button class="text-xs px-2 py-1 rounded-lg ${u.active ? "bg-emerald-50 text-emerald-700" : "bg-slate-100 text-slate-400"}" data-toggle-emp="${u.id}">${u.active ? "Đang dùng" : "Đã ẩn"}</button></td>
          <td class="text-right">
            <button class="text-blue-600 text-xs mr-2" data-edit-user="${u.id}">Sửa</button>
            <button class="text-red-500 text-xs" data-del-user="${u.id}">Xoá</button>
          </td>
        </tr>`).join("") || `<tr><td colspan="5" class="py-6 text-center text-slate-400">Chưa có nhân viên</td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}
function bindStaff() {
  $("btn-add-user").addEventListener("click", () => openUserModal(null));
  document.querySelectorAll("[data-edit-user]").forEach(b => b.addEventListener("click", () => openUserModal(users.find(u => u.id == b.dataset.editUser))));
  document.querySelectorAll("[data-toggle-emp]").forEach(b => b.addEventListener("click", async () => {
    const u = users.find(x => x.id == b.dataset.toggleEmp);
    try { await api(`/api/admin/employees/${u.id}`, { method: "PUT", body: JSON.stringify({ active: u.active ? 0 : 1 }) }); loadUsers(); }
    catch (e) { toast(e.message, false); }
  }));
  document.querySelectorAll("[data-del-user]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("Xoá/ẩn nhân viên này? (đã có ca chấm thì chỉ ẩn)")) return;
    try { await api(`/api/admin/employees/${b.dataset.delUser}`, { method: "DELETE" }); toast("Đã xoá"); loadUsers(); }
    catch (e) { toast(e.message, false); }
  }));
}
function openUserModal(u) {
  $("modal-root").innerHTML = `
  <div class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-40">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm">
      <h3 class="font-bold text-slate-800 mb-4">${u ? "Sửa nhân viên #" + u.id : "Thêm nhân viên"}</h3>
      <label class="text-xs text-slate-500">Tên nhân viên</label>
      <input id="u-name" class="w-full border rounded-xl px-3 py-2 mb-2" placeholder="VD: Nguyễn Văn A" value="${esc(u?.name || "")}"/>
      <label class="text-xs text-slate-500">Lương theo giờ (đ)</label>
      <input id="u-rate" type="number" class="w-full border rounded-xl px-3 py-2 mb-4" placeholder="25000" value="${u?.hourly_rate || ""}"/>
      <div class="flex gap-2">
        <button id="u-cancel" class="flex-1 border rounded-xl py-2 text-sm">Huỷ</button>
        <button id="u-save" class="flex-1 bg-slate-800 text-white rounded-xl py-2 text-sm font-semibold">Lưu</button>
      </div>
    </div>
  </div>`;
  $("u-cancel").addEventListener("click", () => $("modal-root").innerHTML = "");
  $("u-save").addEventListener("click", async () => {
    const body = { name: $("u-name").value.trim(), hourly_rate: +$("u-rate").value || 0 };
    if (!body.name) return toast("Nhập tên nhân viên", false);
    try {
      if (u) await api(`/api/admin/employees/${u.id}`, { method: "PUT", body: JSON.stringify(body) });
      else await api("/api/admin/employees", { method: "POST", body: JSON.stringify(body) });
      $("modal-root").innerHTML = ""; toast("Đã lưu"); loadUsers();
    } catch (e) { toast(e.message, false); }
  });
}

// ---------- Tab Bảng công ----------
function monthHtml() {
  return `
  <div class="bg-white rounded-2xl shadow p-5">
    <div class="flex gap-2 items-end mb-4">
      <div><label class="text-xs text-slate-500">Tháng</label>
        <input id="m-period" type="month" value="${monthNow()}" class="border rounded-xl px-3 py-2"/></div>
      <button id="btn-load-month" class="bg-slate-800 text-white rounded-xl px-4 py-2 text-sm font-semibold">Xem</button>
    </div>
    <div id="month-body"></div>
  </div>`;
}
function bindMonth() {
  $("btn-load-month").addEventListener("click", loadMonth);
  loadMonth();
}
async function loadMonth() {
  const p = $("m-period").value; // YYYY-MM
  if (!p) return;
  try {
    const rows = await api(`/api/admin/attendance?from=${p}-01&to=${p}-31`);
    const byUser = {};
    for (const r of rows) {
      const k = r.name || "?";
      if (!byUser[k]) byUser[k] = { days: new Set(), shifts: 0, hours: 0 };
      byUser[k].shifts++;
      byUser[k].hours += hoursOf(r);
      if (r.check_in_at) byUser[k].days.add(r.check_in_at.slice(0,10));
    }
    $("month-body").innerHTML = `
    <table class="w-full text-sm">
      <thead><tr class="text-left text-slate-400 border-b"><th class="py-2">Nhân viên</th><th>Số ngày</th><th>Số ca</th><th>Tổng giờ</th></tr></thead>
      <tbody>${Object.entries(byUser).map(([n,v])=>`
        <tr class="border-b last:border-0">
          <td class="py-2 font-medium">${esc(n)}</td><td>${v.days.size}</td><td>${v.shifts}</td><td>${v.hours.toFixed(1)}h</td>
        </tr>`).join("") || `<tr><td colspan="4" class="py-6 text-center text-slate-400">Không có ca nào trong tháng</td></tr>`}
      </tbody>
    </table>`;
  } catch (e) { toast(e.message, false); }
}

// ---------- Tab Phiếu lương ----------
function payrollHtml() {
  return `
  <div class="grid md:grid-cols-2 gap-4">
    <div class="bg-white rounded-2xl shadow p-5">
      <h2 class="font-semibold text-slate-700 mb-4">Tạo phiếu lương</h2>
      <label class="text-xs text-slate-500">Nhân viên</label>
      <select id="p-user" class="w-full border rounded-xl px-3 py-2 mb-2">
        ${users.filter(u=>u.active !== 0).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}
      </select>
      <label class="text-xs text-slate-500">Kỳ lương</label>
      <input id="p-period" type="month" value="${monthNow()}" class="w-full border rounded-xl px-3 py-2 mb-2"/>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-xs text-slate-500">Tổng giờ</label>
          <input id="p-hours" type="number" step="0.1" class="w-full border rounded-xl px-3 py-2 mb-2" placeholder="0"/></div>
        <div><label class="text-xs text-slate-500">Lương/giờ (đ)</label>
          <input id="p-rate" type="number" class="w-full border rounded-xl px-3 py-2 mb-2" placeholder="25000"/></div>
        <div><label class="text-xs text-slate-500">Thưởng (đ)</label>
          <input id="p-bonus" type="number" class="w-full border rounded-xl px-3 py-2 mb-2" value="0"/></div>
        <div><label class="text-xs text-slate-500">Phạt (đ)</label>
          <input id="p-penalty" type="number" class="w-full border rounded-xl px-3 py-2 mb-2" value="0"/></div>
      </div>
      <input id="p-note" class="w-full border rounded-xl px-3 py-2 mb-3" placeholder="Ghi chú (tuỳ chọn)"/>
      <div class="flex gap-2">
        <button id="btn-calc" class="flex-1 border rounded-xl py-2 text-sm">Tính giờ từ chấm công</button>
        <button id="btn-preview" class="flex-1 bg-slate-800 text-white rounded-xl py-2 text-sm font-semibold">Xem phiếu</button>
      </div>
    </div>
    <div class="bg-white rounded-2xl shadow p-5">
      <h2 class="font-semibold text-slate-700 mb-4">Phiếu đã tạo</h2>
      <div id="payroll-list" class="text-sm"></div>
    </div>
  </div>
  <div id="slip-wrap" class="mt-4"></div>`;
}
function bindPayroll() {
  $("p-user").addEventListener("change", prefillRate);
  $("btn-calc").addEventListener("click", calcHours);
  $("btn-preview").addEventListener("click", previewSlip);
  prefillRate(); loadPayrolls();
}
function prefillRate() {
  const u = users.find(x => x.id == $("p-user")?.value);
  if (u?.hourly_rate && $("p-rate")) $("p-rate").value = u.hourly_rate;
}
let empShifts = []; // ca của nhân viên đang chọn trong kỳ — đi kèm phiếu
async function fetchEmpShifts(u, period) {
  const rows = await api(`/api/admin/attendance?from=${period}-01&to=${period}-31`);
  return rows
    .filter(r => r.user_id === u?.id || r.name === u?.name)
    .map(r => ({
      date: String(r.check_in_at || "").slice(0, 10),
      in: r.check_in_at, out: r.check_out_at,
      hours: r.check_out_at ? (new Date(r.check_out_at) - new Date(r.check_in_at)) / 3600000 : 0,
    }))
    .sort((a, b) => String(a.in).localeCompare(String(b.in)));
}
async function calcHours() {
  const p = $("p-period").value; if (!p) return toast("Chọn kỳ", false);
  const u = users.find(x => x.id == $("p-user").value);
  try {
    empShifts = await fetchEmpShifts(u, p);
    const h = empShifts.reduce((a, s) => a + s.hours, 0);
    $("p-hours").value = h.toFixed(1);
    toast(`Tổng ${h.toFixed(1)}h trong kỳ ${p}`);
  } catch (e) { toast(e.message, false); }
}
function slipData() {
  const u = users.find(x => x.id == $("p-user").value);
  const name = u?.name || "?";
  const hours = +$("p-hours").value || 0, rate = +$("p-rate").value || 0;
  const bonus = +$("p-bonus").value || 0, penalty = +$("p-penalty").value || 0;
  return { user_name: name, period: $("p-period").value, hours, rate, bonus, penalty,
           total: Math.round(hours * rate + bonus - penalty), note: $("p-note").value.trim(),
           shifts: empShifts };
}
async function previewSlip() {
  const u = users.find(x => x.id == $("p-user").value);
  if (!u || !$("p-period").value) return toast("Chọn nhân viên + kỳ", false);
  try { empShifts = await fetchEmpShifts(u, $("p-period").value); } catch {}
  const d = slipData();
  $("slip-wrap").innerHTML = `
  <div class="bg-white rounded-2xl shadow p-6 max-w-md mx-auto" id="slip-preview">
    <h3 class="text-center font-bold text-lg text-slate-800">PHIẾU LƯƠNG — ${esc(d.period)}</h3>
    <p class="text-center text-xs text-slate-400 mb-4">${esc(S().name)}</p>
    ${d.shifts?.length ? `
    <table class="w-full text-xs mb-3">
      <thead><tr class="border-b text-left text-slate-400">
        <th class="py-1">Ngày</th><th>Vào</th><th>Ra</th><th class="text-right">Giờ</th></tr></thead>
      <tbody>${d.shifts.map(s=>`
        <tr class="border-b border-slate-50">
          <td class="py-1">${esc(s.date ? s.date.slice(8,10) + "/" + s.date.slice(5,7) : "—")}</td>
          <td>${s.in ? fmtTime(s.in) : "—"}</td>
          <td>${s.out ? fmtTime(s.out) : "chưa tan"}</td>
          <td class="text-right font-semibold">${s.hours.toFixed(1)}h</td>
        </tr>`).join("")}
      </tbody>
    </table>` : ""}
    <table class="w-full text-sm">
      <tr class="border-b"><td class="py-2 text-slate-500">Nhân viên</td><td class="text-right font-medium">${esc(d.user_name)}</td></tr>
      <tr class="border-b"><td class="py-2 text-slate-500">Tổng giờ làm</td><td class="text-right">${d.hours}h</td></tr>
      <tr class="border-b"><td class="py-2 text-slate-500">Lương/giờ</td><td class="text-right">${fmtMoney(d.rate)}</td></tr>
      <tr class="border-b"><td class="py-2 text-slate-500">Lương chính</td><td class="text-right">${fmtMoney(Math.round(d.hours * d.rate))}</td></tr>
      <tr class="border-b"><td class="py-2 text-slate-500">Thưởng</td><td class="text-right text-emerald-600">+${fmtMoney(d.bonus)}</td></tr>
      <tr class="border-b"><td class="py-2 text-slate-500">Phạt</td><td class="text-right text-red-600">-${fmtMoney(d.penalty)}</td></tr>
      <tr><td class="py-3 font-bold">THỰC LĨNH</td><td class="text-right font-bold text-lg">${fmtMoney(d.total)}</td></tr>
      ${d.note ? `<tr><td colspan="2" class="text-xs text-slate-400 pt-2">Ghi chú: ${esc(d.note)}</td></tr>` : ""}
    </table>
  </div>
  <div class="flex gap-2 justify-center mt-3">
    <button id="btn-save-slip" class="bg-emerald-600 text-white rounded-xl px-5 py-2 text-sm font-semibold">Lưu phiếu</button>
    <button id="btn-print" class="bg-slate-800 text-white rounded-xl px-5 py-2 text-sm font-semibold">In / Xuất PDF</button>
  </div>`;
  $("btn-print").addEventListener("click", () => {
    const el = document.getElementById("slip-preview");
    const w = window.open("", "_blank", "width=420,height=640");
    if (!el || !w) { window.print(); return; }
    const styles = Array.from(document.querySelectorAll("style,link[rel=stylesheet]")).map((s) => s.outerHTML).join("");
    w.document.write(`<!doctype html><html><head><meta charset="utf-8">${styles}<style>body{margin:0;padding:16px}</style></head><body>${el.outerHTML}</body></html>`);
    w.document.close();
    w.focus();
    setTimeout(() => { w.print(); w.close(); }, 350);
  });
  $("btn-save-slip").addEventListener("click", async () => {
    try { await api("/api/admin/payroll", { method: "POST", body: JSON.stringify(d) });
      toast("Đã lưu phiếu"); loadPayrolls();
    } catch (e) { toast(e.message, false); }
  });
}
async function loadPayrolls() {
  try {
    payrolls = await api("/api/admin/payroll");
    const el = $("payroll-list"); if (!el) return;
    el.innerHTML = payrolls.map(p => `
      <div class="flex items-center gap-2 py-2 border-b last:border-0">
        <div class="flex-1"><span class="font-medium">${esc(p.user_name)}</span>
          <span class="text-xs text-slate-400 ml-2">${esc(p.period)} — ${fmtMoney(p.total)}</span></div>
        <button class="text-blue-600 text-xs" data-print-p="${p.id}">In</button>
        <button class="text-red-500 text-xs" data-del-p="${p.id}">Xoá</button>
      </div>`).join("") || `<p class="text-slate-400">Chưa có phiếu nào.</p>`;
    el.querySelectorAll("[data-del-p]").forEach(b => b.addEventListener("click", async () => {
      if (!confirm("Xoá phiếu này?")) return;
      try { await api(`/api/admin/payroll/${b.dataset.delP}`, { method: "DELETE" }); loadPayrolls(); }
      catch (e) { toast(e.message, false); }
    }));
    el.querySelectorAll("[data-print-p]").forEach(b => b.addEventListener("click", () => {
      const p = payrolls.find(x => x.id == b.dataset.printP); if (!p) return;
      $("p-hours").value = p.hours; $("p-rate").value = p.rate;
      $("p-bonus").value = p.bonus; $("p-penalty").value = p.penalty;
      $("p-note").value = p.note || "";
      const u = users.find(x => x.name === p.user_name);
      if (u) $("p-user").value = u.id;
      $("p-period").value = p.period;
      try { empShifts = JSON.parse(p.shifts_json || "[]"); } catch { empShifts = []; }
      previewSlip();
    }));
  } catch (e) { /* bảng chưa có trên server cũ — bỏ qua */ }
}

render();
</script>
</body>
</html>
