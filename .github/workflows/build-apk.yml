name: Build POS Server APK

# Chạy tay: Actions → Build POS Server APK → Run workflow
# Output: artifact chứa POS-Server.apk (terminal + POS payload)
#         và POS-Boot.apk (autostart khi mở máy — cài thêm nếu cần)

on:
  workflow_dispatch:
    inputs:
      termux_ref:
        description: "Tag/branch của termux-app"
        required: true
        default: "v0.118.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pos_fnb
        uses: actions/checkout@v4
        with:
          path: pos_fnb

      - name: Checkout termux-app
        uses: actions/checkout@v4
        with:
          repository: termux/termux-app
          ref: ${{ inputs.termux_ref }}
          path: termux-app

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build APKs
        run: bash pos_fnb/apk/build-apk.sh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pos-server-apk
          path: |
            termux-app/app/build/outputs/apk/debug/*.apk
            /tmp/pos-boot.apk
          if-no-files-found: ignore
