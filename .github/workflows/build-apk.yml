name: Build POS Server APK

# Chạy tay: Actions → Build POS Server APK → Run workflow
# Output: artifact chứa POS-Server.apk (terminal + POS payload)
#         và POS-Boot.apk (autostart khi mở máy — cài thêm nếu cần)

on:
  workflow_dispatch:
    inputs:
      termux_ref:
        description: "Tag/branch của termux-app"
        required: true
        default: "v0.118.3"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pos_fnb
        uses: actions/checkout@v4
        with:
          path: pos_fnb

      - name: Checkout termux-app
        uses: actions/checkout@v4
        with:
          repository: termux/termux-app
          ref: ${{ inputs.termux_ref }}
          path: termux-app

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build APKs
        run: bash pos_fnb/apk/build-apk.sh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pos-server-apk
          path: |
            termux-app/app/build/outputs/apk/debug/*.apk
            /tmp/pos-boot.apk
          if-no-files-found: ignore

      - name: Publish to release apk-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp termux-app/app/build/outputs/apk/debug/*universal*.apk ./POS-Server.apk
          cp /tmp/pos-boot.apk ./POS-Boot.apk 2>/dev/null || true
          gh release delete apk-latest -y --cleanup-tag 2>/dev/null || true
          gh release create apk-latest --title "POS Server APK" \
            --notes "Auto-build. Cài POS-Server.apk → mở app → tự cài + chạy." \
            POS-Server.apk POS-Boot.apk 2>/dev/null || \
          gh release create apk-latest --title "POS Server APK" \
            --notes "Auto-build." POS-Server.apk
