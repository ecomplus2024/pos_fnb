<!DOCTYPE html>
<html lang="vi">
  <head>

    <meta name="description" content="Demo POS chạy trên Cloudflare Workers + D1" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="stylesheet" href="/styles.css" />
    <style>
      /* Be Vietnam Pro — bundle local, hỗ trợ đầy đủ dấu tiếng Việt.
         Fix lỗi font trên tablet/Android thiếu glyph tiếng Việt. */
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/bvp-400-vi.woff2') format('woff2');
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/bvp-400.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+2000-206F, U+20A0-20BF, U+2100-214F;
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/bvp-600-vi.woff2') format('woff2');
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/bvp-600.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+2000-206F, U+20A0-20BF, U+2100-214F;
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/bvp-700-vi.woff2') format('woff2');
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/bvp-700.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+2000-206F, U+20A0-20BF, U+2100-214F;
      }
      body {
        font-family: 'Be Vietnam Pro', Roboto, 'Noto Sans', system-ui, sans-serif;
      }

      /* Custom utilities cho PublicMenu (primary blue palette + animations) */
      .bg-primary-50 { background-color: #eff6ff; }
      .bg-primary-100 { background-color: #dbeafe; }
      .bg-primary-200 { background-color: #bfdbfe; }
      .bg-primary-400 { background-color: #60a5fa; }
      .bg-primary-500 { background-color: #3b82f6; }
      .bg-primary-600 { background-color: #2563eb; }
      .bg-primary-700 { background-color: #1d4ed8; }
      .bg-primary-800 { background-color: #1e40af; }
      .bg-primary-900 { background-color: #1e3a8a; }
      .text-primary-100 { color: #dbeafe; }
      .text-primary-200 { color: #bfdbfe; }
      .text-primary-400 { color: #60a5fa; }
      .text-primary-500 { color: #3b82f6; }
      .text-primary-600 { color: #2563eb; }
      .text-primary-700 { color: #1d4ed8; }
      .text-primary-800 { color: #1e40af; }
      .border-primary-200 { border-color: #bfdbfe; }
      .border-primary-400 { border-color: #60a5fa; }
      .border-primary-500 { border-color: #3b82f6; }
      .border-primary-600 { border-color: #2563eb; }
      .ring-primary-400 { --tw-ring-color: #60a5fa; }
      .sticky-top-72 { position: sticky; top: 72px; z-index: 10; }
      .sticky-top-120 { position: sticky; top: 120px; z-index: 10; }
      @keyframes pulse-ring {
        0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
        70% { box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); }
        100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
      }
      @keyframes wiggle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-10deg); }
        75% { transform: rotate(10deg); }
      }
      @keyframes blob {
        0%, 100% { transform: translate(0,0) scale(1); }
        33% { transform: translate(30px,-50px) scale(1.1); }
        66% { transform: translate(-20px,20px) scale(0.9); }
      }
      .animate-wiggle { animation: wiggle 0.5s ease-in-out; }
      .animate-pulse-ring { animation: pulse-ring 1.5s ease-out infinite; }
      .animate-blob { animation: blob 7s infinite; }
      .animation-delay-2000 { animation-delay: 2s; }
      .animation-delay-4000 { animation-delay: 4s; }
      .animate-bounce-slow { animation: bounce 2s infinite; }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .animate-in { animation-duration: 200ms; animation-fill-mode: forwards; }
      .fade-in { animation-name: fadeIn; }
      .slide-in-from-bottom { animation-name: slideInFromBottom; }
      .zoom-in-95 { animation-name: zoomIn95; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideInFromBottom { from { transform: translateY(100%); } to { transform: translateY(0); } }
      @keyframes zoomIn95 { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes slideInRight { from { transform: translateX(120%); } to { transform: translateX(0); } }
      .animate-slide-in-right { animation: slideInRight 0.3s ease-out; }

      /* Tailwind v3 generates all responsive variants - no manual @media needed */

      /* Mobile bottom nav safe area for iOS */
      .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
  </head>
  <body class="bg-stone-50">
    <div id="root"></div>
    <!-- React 18 UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone để transform JSX trong browser -->
    <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
    <!-- QR Code generator for table QR download -->
    <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
    <!-- App JSX -->
    <script type="text/babel" data-presets="react" data-type="module" src="/app.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('SW registered:', reg.scope);
              // Listen for updates — auto reload khi có bản mới
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('New SW available — auto reloading');
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(err => console.error('SW registration failed:', err));
          // Reload trang khi SW mới tiếp quản
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
